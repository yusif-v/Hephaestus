# Hephaestus v0.2 — Heimdall Anomaly Detection (Kaggle)
task_name: heimdall-anomaly-kaggle

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  dtype: "float16"

dataset:
  train_path: "data/heimdall/kaggle_train.jsonl"
  test_path: "data/heimdall/kaggle_test.jsonl"
  max_samples: 90000
  max_val_samples: 10000

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  max_steps: 200
  learning_rate: 0.00002
  warmup_steps: 20
  batch_size: 4
  gradient_accumulation_steps: 2
  optimizer: "adamw_bnb_8bit"
  gradient_checkpointing: true
  bf16: true
  max_length: 512
  logging_steps: 20

evaluation:
  quality_gate: 0.97
  metrics: ["accuracy", "f1"]
  max_test_samples: 10000
  task_type: "binary"
  classes: ["ANOMALOUS", "NORMAL"]

export:
  quantize: "int4"
  format: "safetensors"
  benchmark: true

output:
  dir: "outputs/heimdall-0.5b-kaggle"
  save_model_card: true